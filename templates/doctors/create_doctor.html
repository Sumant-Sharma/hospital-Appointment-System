{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register Doctor - Admin CarePulse{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card custom-card border-0 p-4 p-md-5 rounded-4 shadow-sm">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                        <i class="fa-solid fa-user-doctor fs-4"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Register New Doctor</h4>
                        <p class="text-muted small mb-0">Admin creation of medical staff credentials & profile</p>
                    </div>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'core:admin_dashboard' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">Register Doctor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
